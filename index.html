// ---------- Utilidades ----------
const fmt = (n) => {
  if (!isFinite(n)) return '—';
  return '$' + n.toLocaleString('es-EC', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
const fmtInt = (n) => n.toLocaleString('es-EC', { maximumFractionDigits: 0 });

const monthsToYears = (m) => {
  if (!isFinite(m)) return '—';
  const y = Math.floor(m / 12);
  const rem = Math.round(m % 12);
  if (y === 0) return `${rem} ${rem === 1 ? 'mes' : 'meses'}`;
  if (rem === 0) return `${y} ${y === 1 ? 'año' : 'años'}`;
  return `${y} ${y === 1 ? 'año' : 'años'} y ${rem} ${rem === 1 ? 'mes' : 'meses'}`;
};

// ---------- Motores de cálculo: amortización ----------
function calcularAmortizacion(P, r, n, sistema) {
  const rows = [];
  let saldo = P;

  if (sistema === 'francesa') {
    const pago = (P * r) / (1 - Math.pow(1 + r, -n));
    for (let t = 1; t <= n; t++) {
      const interes = saldo * r;
      let capital = pago - interes;
      let saldoFinal = saldo - capital;
      if (t === n) { capital += saldoFinal; saldoFinal = 0; }
      rows.push({ t, saldoInicial: saldo, pago, interes, capital, saldoFinal });
      saldo = saldoFinal;
    }
  } else if (sistema === 'alemana') {
    const capitalFijo = P / n;
    for (let t = 1; t <= n; t++) {
      const interes = saldo * r;
      const pago = capitalFijo + interes;
      const saldoFinal = Math.max(0, saldo - capitalFijo);
      rows.push({ t, saldoInicial: saldo, pago, interes, capital: capitalFijo, saldoFinal });
      saldo = saldoFinal;
    }
  } else { // americana
    for (let t = 1; t <= n; t++) {
      const interes = saldo * r;
      const capital = t === n ? saldo : 0;
      const pago = interes + capital;
      const saldoFinal = saldo - capital;
      rows.push({ t, saldoInicial: saldo, pago, interes, capital, saldoFinal });
      saldo = saldoFinal;
    }
  }
  return { rows, totalInteres: rows.reduce((a, b) => a + b.interes, 0) };
}

function calcularSimple(P, r, n) {
  const rows = [];
  let saldo = P;
  for (let t = 1; t <= n; t++) {
    const interes = P * r;
    const saldoFinal = saldo + interes;
    rows.push({ t, saldoInicial: saldo, interes, capital: P, saldoFinal });
    saldo = saldoFinal;
  }
  return { rows, totalInteres: rows.reduce((a, b) => a + b.interes, 0), saldoFinal: saldo };
}

function calcularCompuesto(P, r, n) {
  const rows = [];
  let saldo = P;
  for (let t = 1; t <= n; t++) {
    const interes = saldo * r;
    const saldoFinal = saldo + interes;
    rows.push({ t, saldoInicial: saldo, interes, capital: P, saldoFinal });
    saldo = saldoFinal;
  }
  return { rows, totalInteres: rows.reduce((a, b) => a + b.interes, 0), saldoFinal: saldo };
}

// ---------- Motor unificado de simulación (simulador de destinos) ----------
function simularCamino({ tipo, monto, base, tasaAnual = 0, extraMensual = 0, extrasUnicos = [], maxMeses = 1200 }) {
  const r = tasaAnual / 100 / 12;
  const aporteExtra = (m) =>
    extraMensual + extrasUnicos.reduce((acc, e) => acc + (m === e.mes ? (e.monto || 0) : 0), 0);

  if (tipo === 'alcancia') {
    let saldo = 0;
    const serie = [{ mes: 0, saldo: 0 }];
    for (let m = 1; m <= maxMeses; m++) {
      saldo += base + aporteExtra(m);
      serie.push({ mes: m, saldo: Math.min(saldo, monto) });
      if (saldo >= monto) return { meses: m, totalInteres: 0, serie, alcanzado: true };
    }
    return { meses: Infinity, totalInteres: 0, serie, alcanzado: false };
  }

  if (tipo === 'ahorroSimple') {
    let principal = 0, interesAcum = 0;
    const serie = [{ mes: 0, saldo: 0 }];
    for (let m = 1; m <= maxMeses; m++) {
      principal += base + aporteExtra(m);
      interesAcum += principal * r;
      const saldo = principal + interesAcum;
      serie.push({ mes: m, saldo });
      if (saldo >= monto) return { meses: m, totalInteres: interesAcum, serie, alcanzado: true };
    }
    return { meses: Infinity, totalInteres: interesAcum, serie, alcanzado: false };
  }

  if (tipo === 'ahorroCompuesto') {
    let saldo = 0, aportado = 0;
    const serie = [{ mes: 0, saldo: 0 }];
    for (let m = 1; m <= maxMeses; m++) {
      const aporte = base + aporteExtra(m);
      saldo = saldo * (1 + r) + aporte;
      aportado += aporte;
      serie.push({ mes: m, saldo });
      if (saldo >= monto) return { meses: m, totalInteres: saldo - aportado, serie, alcanzado: true };
    }
    return { meses: Infinity, totalInteres: saldo - aportado, serie, alcanzado: false };
  }

  // deuda (préstamo o tarjeta)
  let saldo = monto, interesTotal = 0;
  const serie = [{ mes: 0, saldo }];
  const hayExtraUnico = extrasUnicos.some((e) => (e.monto || 0) > 0);
  if (base + extraMensual <= saldo * r && !hayExtraUnico) {
    return { meses: Infinity, totalInteres: Infinity, serie, nuncaPaga: true };
  }
  for (let m = 1; m <= maxMeses; m++) {
    const interes = saldo * r;
    interesTotal += interes;
    const pago = base + aporteExtra(m);
    saldo = saldo + interes - pago;
    if (saldo < 0) saldo = 0;
    serie.push({ mes: m, saldo });
    if (saldo <= 0) return { meses: m, totalInteres: interesTotal, serie, nuncaPaga: false };
  }
  return { meses: Infinity, totalInteres: interesTotal, serie, nuncaPaga: false };
}

      texto: 'Aquí el interés se calcula sobre el saldo acumulado, no solo sobre el monto inicial. Es "interés sobre interés": cada periodo el saldo crece un poco más, y el siguiente interés se calcula sobre ese saldo ya más grande. Por eso es la base de las inversiones a largo plazo, y también la razón por la que una deuda impaga puede crecer muy rápido.',
      formulas: [{ nombre: 'Monto final', expr: 'F = P · (1 + r)ᵗ' }],

// ---------- Texto de fórmula por fila (para el modal de detalle) ----------
function explicacionFila(row, tipo, sistema, r) {
  if (tipo === 'anualidad') {
    if (sistema === 'francesa') {
      return [
        `Interés = Saldo anterior × r = ${fmt(row.saldoInicial)} × ${r.toFixed(5)} = ${fmt(row.interes)}`,
        `Capital = Pago − Interés = ${fmt(row.pago)} − ${fmt(row.interes)} = ${fmt(row.capital)}`,
        `Saldo nuevo = Saldo anterior − Capital = ${fmt(row.saldoInicial)} − ${fmt(row.capital)} = ${fmt(row.saldoFinal)}`,
        `En el sistema francés el pago es siempre el mismo (${fmt(row.pago)}); lo que cambia es cuánto de ese pago es interés y cuánto capital.`,
      ];
    }
    if (sistema === 'alemana') {
      return [
        `Capital fijo = P / n = ${fmt(row.capital)} (siempre el mismo en cada periodo)`,
        `Interés = Saldo anterior × r = ${fmt(row.saldoInicial)} × ${r.toFixed(5)} = ${fmt(row.interes)}`,
        `Pago = Capital + Interés = ${fmt(row.capital)} + ${fmt(row.interes)} = ${fmt(row.pago)}`,
        `Como el capital que abonas no cambia pero el saldo va bajando, el interés y el pago total son cada vez más pequeños.`,
      ];
    }
    return [
      `Interés = Saldo × r = ${fmt(row.saldoInicial)} × ${r.toFixed(5)} = ${fmt(row.interes)}`,
      row.capital > 0
        ? `Este es el último periodo: se devuelve todo el capital de una vez = ${fmt(row.capital)}`
        : `Capital abonado este periodo = ${fmt(row.capital)} (en el sistema americano solo se paga interés hasta el final)`,
      `Pago total = Interés + Capital = ${fmt(row.pago)}`,
    ];
  }
  if (tipo === 'simple') {
    return [
      `Interés = P × r = ${fmt(row.capital)} × ${r.toFixed(5)} = ${fmt(row.interes)}`,
      `Saldo nuevo = Saldo anterior + Interés = ${fmt(row.saldoInicial)} + ${fmt(row.interes)} = ${fmt(row.saldoFinal)}`,
      `El interés no se acumula sobre sí mismo: cada periodo genera exactamente lo mismo.`,
    ];
  }
  return [
    `Interés = Saldo anterior × r = ${fmt(row.saldoInicial)} × ${r.toFixed(5)} = ${fmt(row.interes)}`,
    `Saldo nuevo = Saldo anterior × (1 + r) = ${fmt(row.saldoInicial)} × ${(1 + r).toFixed(5)} = ${fmt(row.saldoFinal)}`,
    `Este interés ya generado empezará, a su vez, a generar más interés el siguiente periodo.`,
  ];
}

function FilaDetalleModal({ row, rows, tipo, sistema, r, onClose }) {
  const historia = rows.slice(0, row.t).map((rr) => ({
    periodo: rr.t,
    Interés: rr.interes,
    Capital: rr.capital,
    Saldo: rr.saldoFinal,
  }));
  const lineas = explicacionFila(row, tipo, sistema, r);

  return (
    <Modal onClose={onClose} wide>
      <div className="flex items-center gap-2 text-[#4530B8] font-semibold text-sm mb-1" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>
        <Eye size={16} /> Periodo {row.t}
      </div>
      <h3 className="text-2xl text-[#1A1533] mb-4" style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600 }}>
        Así se calculó este registro
      </h3>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-5">
        <StatCard label="Saldo inicial" value={fmt(row.saldoInicial)} accent="blue" />
        <StatCard label="Interés" value={fmt(row.interes)} accent="coral" />
        <StatCard label="Capital" value={fmt(row.capital)} accent="teal" />
        <StatCard label="Saldo final" value={fmt(row.saldoFinal)} accent="blue" />
      </div>

      <div className="bg-[#F7F5FF] rounded-2xl p-4 mb-5 space-y-2" style={{ fontFamily: "'JetBrains Mono', monospace" }}>
        {lineas.map((l, i) => (

// ---------- Tab de calculadoras ----------

  const r = tipoTasa === 'mensual' ? tasa / 100 : tasa / 100 / 12;

  const resultado = useMemo(() => {
    if (tipo === 'anualidad') return calcularAmortizacion(P, r, n, sistema);
    if (tipo === 'simple') return calcularSimple(P, r, n);
    return calcularCompuesto(P, r, n);
  }, [tipo, P, r, n, sistema]);

  const chartData = resultado.rows.map((row) => ({
    periodo: row.t,
    Capital: row.capital,
    Interés: row.interes,
  }));

  return (
    <div className="space-y-6">
      <div className="flex flex-wrap gap-2">
        <PillButton active={tipo === 'simple'} onClick={() => setTipo('simple')}>Interés simple</PillButton>
        <PillButton active={tipo === 'compuesto'} onClick={() => setTipo('compuesto')}>Interés compuesto</PillButton>
        <PillButton active={tipo === 'anualidad'} onClick={() => setTipo('anualidad')}>Anualidades</PillButton>
      </div>

      <TemaIntro tipo={tipo} sistema={sistema} />

      {tipo === 'anualidad' && (
        <div className="flex flex-wrap gap-2">
          <PillButton active={sistema === 'francesa'} onClick={() => setSistema('francesa')}>Francesa (cuota fija)</PillButton>
          <PillButton active={sistema === 'alemana'} onClick={() => setSistema('alemana')}>Alemana (capital fijo)</PillButton>
          <PillButton active={sistema === 'americana'} onClick={() => setSistema('americana')}>Americana (bullet)</PillButton>
        </div>
      )}

      <div className="grid sm:grid-cols-4 gap-4 bg-white p-4 rounded-2xl border border-[#EDEAFB]">
        <Field label={tipo === 'anualidad' ? 'Monto del préstamo' : 'Capital inicial'} value={P} onChange={setP} min={0} step={100} />
        <Field label="Tasa de interés" suffix="%" value={tasa} onChange={setTasa} min={0} step={0.1} />
        <label className="flex flex-col gap-1">
          <span className="text-xs uppercase tracking-wide text-gray-500 font-semibold">Tipo de tasa</span>
          <select value={tipoTasa} onChange={(e) => setTipoTasa(e.target.value)} className="border-2 border-[#EDEAFB] rounded-xl px-3 py-2.5 bg-white text-[#1A1533]">
            <option value="mensual">Mensual directa</option>
            <option value="anual">Anual (÷12)</option>
          </select>
        </label>
        <Field label="Número de periodos" suffix="meses" value={n} onChange={(v) => setN(Math.max(1, Math.round(v)))} min={1} step={1} />
      </div>

      <div className="grid sm:grid-cols-3 gap-3">
        {tipo === 'anualidad' && sistema === 'francesa' && <StatCard label="Pago mensual" value={fmt(resultado.rows[0].pago)} accent="blue" />}
        {tipo === 'anualidad' && sistema !== 'francesa' && (
          <>
            <StatCard label="Primer pago" value={fmt(resultado.rows[0].pago)} accent="blue" />
            <StatCard label="Último pago" value={fmt(resultado.rows[resultado.rows.length - 1].pago)} accent="blue" />
          </>
        )}
        {tipo !== 'anualidad' && <StatCard label="Saldo final" value={fmt(resultado.saldoFinal)} accent="blue" />}
        <StatCard label="Interés total" value={fmt(resultado.totalInteres)} accent="coral" />
        <StatCard label={tipo === 'anualidad' ? 'Capital total' : 'Capital inicial'} value={fmt(P)} accent="teal" />
      </div>

      <div>
        <div className="text-xs uppercase tracking-wide text-gray-500 font-semibold mb-2">
          Composición {tipo === 'anualidad' ? 'del pago' : 'del saldo'} por periodo

            <BarChart data={chartData} margin={{ top: 8, right: 8, left: 0, bottom: 0 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="#EEF0F0" vertical={false} />
              <XAxis dataKey="periodo" tick={{ fontSize: 11, fill: '#9CA3AF' }} label={{ value: 'Periodo (mes)', position: 'insideBottom', offset: -2, fontSize: 11, fill: '#9CA3AF' }} />
              <YAxis tick={{ fontSize: 11, fill: '#9CA3AF' }} tickFormatter={(v) => '$' + fmtInt(v)} />
              <Tooltip formatter={(v) => fmt(v)} contentStyle={{ fontSize: 12, borderRadius: 12 }} />
              <Legend wrapperStyle={{ fontSize: 12 }} />
              <Bar dataKey="Capital" stackId="a" fill="#12B76A" radius={[0, 0, 0, 0]} />

      <div>

          <table className="w-full text-sm" style={{ fontFamily: "'JetBrains Mono', monospace" }}>
            <thead>
              <tr className="bg-[#F7F5FF] text-gray-500 text-xs uppercase tracking-wide">
                <th className="px-3 py-2.5 text-left font-semibold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>Periodo</th>
                <th className="px-3 py-2.5 text-right font-semibold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>Saldo inicial</th>
                {tipo === 'anualidad' && <th className="px-3 py-2.5 text-right font-semibold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>Pago</th>}
                <th className="px-3 py-2.5 text-right font-semibold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>Interés</th>
                <th className="px-3 py-2.5 text-right font-semibold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>Capital</th>
                <th className="px-3 py-2.5 text-right font-semibold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>Saldo final</th>
                <th className="px-2 py-2.5 font-semibold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>Ver</th>
              </tr>
            </thead>
            <tbody>
              {resultado.rows.map((row) => (
                <FilaTabla key={row.t} row={row} tipo={tipo} sistema={sistema} r={r} onVer={() => setModalRow(row)} />
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {modalRow && (
        <FilaDetalleModal row={modalRow} rows={resultado.rows} tipo={tipo} sistema={sistema} r={r} onClose={() => setModalRow(null)} />

  );
}

// ---------- Modal de detalle de un destino (con pagos extraordinarios) ----------
let extraIdSeq = 1;

function DestinoDetalleModal({ path, objetivo, capacidad, tasaAnual, onClose }) {
  const [extraMensual, setExtraMensual] = useState(0);
  const [extrasUnicos, setExtrasUnicos] = useState([{ id: extraIdSeq++, mes: 3, monto: 0 }]);

  const agregarExtra = () => {
    setExtrasUnicos((arr) => {
      const ultimoMes = arr.length ? arr[arr.length - 1].mes : 0;
      return [...arr, { id: extraIdSeq++, mes: ultimoMes + 3, monto: 0 }];
    });
  };
  const quitarExtra = (id) => setExtrasUnicos((arr) => arr.filter((e) => e.id !== id));
  const actualizarExtra = (id, campo) => (valor) =>
    setExtrasUnicos((arr) => arr.map((e) => (e.id === id ? { ...e, [campo]: valor } : e)));

  const base = useMemo(
    () => simularCamino({ tipo: path.tipoSim, monto: objetivo, base: capacidad, tasaAnual }),
    [path, objetivo, capacidad, tasaAnual]
  );
  const ajustado = useMemo(
    () => simularCamino({
      tipo: path.tipoSim, monto: objetivo, base: capacidad, tasaAnual,
      extraMensual, extrasUnicos,
    }),
    [path, objetivo, capacidad, tasaAnual, extraMensual, extrasUnicos]
  );

  const esDeuda = path.tipo === 'deuda';
  const diffMeses = isFinite(base.meses) && isFinite(ajustado.meses) ? base.meses - ajustado.meses : 0;
  const diffInteres = isFinite(base.totalInteres) && isFinite(ajustado.totalInteres) ? base.totalInteres - ajustado.totalInteres : 0;

  const maxM = Math.min(240, Math.max(
    isFinite(base.meses) ? base.meses : 60,
    isFinite(ajustado.meses) ? ajustado.meses : 60,
    12
  ));
  const chartData = [];
  for (let m = 0; m <= maxM; m++) {
    chartData.push({
      mes: m,
      Base: base.serie[m]?.saldo ?? (esDeuda ? 0 : base.serie[base.serie.length - 1]?.saldo),
      'Con abonos extra': ajustado.serie[m]?.saldo ?? (esDeuda ? 0 : ajustado.serie[ajustado.serie.length - 1]?.saldo),
    });
  }

  const PathIcon = path.icon;

  return (
    <Modal onClose={onClose} wide>
      <div className="flex items-center gap-2 text-[#4530B8] font-semibold text-sm mb-1" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>
        <PathIcon size={16} /> {path.label}
      </div>
      <h3 className="text-2xl text-[#1A1533] mb-4" style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600 }}>
        Analiza este destino
      </h3>

      <p className="text-sm text-gray-600 mb-4">
        {esDeuda
          ? 'Prueba qué pasa si abonas un poco más cada mes, o si agregas uno o varios pagos extraordinarios en meses puntuales (por ejemplo, un bono o un aguinaldo).'
          : 'Prueba qué pasa si aportas un poco más cada mes, o si agregas uno o varios aportes únicos en meses puntuales.'}
      </p>

      <div className="bg-[#F7F5FF] rounded-2xl p-4 mb-5 space-y-4">
        <div className="sm:max-w-xs">
          <Field label={esDeuda ? 'Abono extra mensual' : 'Aporte extra mensual'} suffix="$" value={extraMensual} onChange={setExtraMensual} min={0} step={5} />
        </div>

        <div className="border-t border-[#E3DBFF] pt-4">
          <div className="flex items-center justify-between mb-3">
            <span className="text-xs uppercase tracking-wide text-gray-500 font-semibold">
              {esDeuda ? 'Pagos extraordinarios puntuales' : 'Aportes únicos extra'}
            </span>
            <button
              onClick={agregarExtra}
              className="flex items-center gap-1 text-xs font-semibold text-white pl-2.5 pr-3 py-1.5 rounded-full hover:opacity-90 transition-opacity"
              style={{ background: 'linear-gradient(135deg, #5B3DF5, #4530B8)' }}
            >
              <Plus size={14} /> Agregar pago
            </button>
          </div>

          {extrasUnicos.length === 0 && (
            <p className="text-xs text-gray-400 italic">Sin pagos puntuales — agrega uno con el botón de arriba.</p>
          )}

          <div className="grid sm:grid-cols-2 gap-3">
            {extrasUnicos.map((extra, i) => (
              <div key={extra.id} className="relative bg-white border border-[#E3DBFF] rounded-2xl p-3 pt-3.5">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-[11px] uppercase tracking-wide text-[#5B3DF5] font-semibold">
                    Pago extra #{i + 1}
                  </span>
                  <button
                    onClick={() => quitarExtra(extra.id)}
                    className="p-1 rounded-full text-gray-400 hover:bg-[#FFE8E3] hover:text-[#C23E28] transition-colors"
                    aria-label={`Quitar pago extra ${i + 1}`}
                  >
                    <X size={13} />
                  </button>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <Field
                    label={esDeuda ? 'Pago único' : 'Monto'}
                    suffix="$"
                    value={extra.monto}
                    onChange={actualizarExtra(extra.id, 'monto')}
                    min={0}
                    step={50}
                  />
                  <Field
                    label="En el mes"
                    value={extra.mes}
                    onChange={(v) => actualizarExtra(extra.id, 'mes')(Math.max(1, Math.round(v)))}
                    min={1}
                    step={1}
                  />
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="grid sm:grid-cols-2 gap-3 mb-5">
        <div className="rounded-2xl border border-[#EDEAFB] p-4">
          <div className="text-[11px] uppercase tracking-wide text-gray-500 font-semibold mb-1">Escenario base</div>
          <div className="text-lg font-semibold text-[#1A1533]" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>{monthsToYears(base.meses)}</div>
          <div className="text-sm text-gray-500">{esDeuda ? 'interés pagado' : 'interés ganado'}: {fmt(base.totalInteres)}</div>
        </div>
        <div className="rounded-2xl border-2 border-[#12B76A] p-4 bg-[#E3FBEF]">
          <div className="text-[11px] uppercase tracking-wide text-[#067A48] font-semibold mb-1">Con tus abonos extra</div>
          <div className="text-lg font-semibold text-[#067A48]" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>{monthsToYears(ajustado.meses)}</div>
          <div className="text-sm text-[#067A48]">{esDeuda ? 'interés pagado' : 'interés ganado'}: {fmt(ajustado.totalInteres)}</div>
        </div>
      </div>

      {(diffMeses !== 0 || diffInteres !== 0) && isFinite(diffMeses) && (
        <div className="flex items-center gap-2 text-sm text-[#067A48] bg-[#E3FBEF] rounded-xl px-4 py-3 mb-5">
          <ArrowRight size={16} />
          {esDeuda
            ? `Sales de la deuda ${monthsToYears(Math.max(0, diffMeses))} antes y te ahorras ${fmt(Math.max(0, diffInteres))} en intereses.`
            : `Llegas a tu meta ${monthsToYears(Math.max(0, diffMeses))} antes.`}
        </div>
      )}

      <div className="text-xs uppercase tracking-wide text-gray-500 font-semibold mb-2">Saldo mes a mes</div>
      <div className="bg-white border border-[#EDEAFB] rounded-2xl p-3" style={{ height: 220 }}>
        <ResponsiveContainer width="100%" height="100%">
          <LineChart data={chartData} margin={{ top: 8, right: 8, left: 0, bottom: 0 }}>
            <CartesianGrid strokeDasharray="3 3" stroke="#EEF0F0" vertical={false} />
            <XAxis dataKey="mes" tick={{ fontSize: 10, fill: '#9CA3AF' }} label={{ value: 'Meses', position: 'insideBottom', offset: -2, fontSize: 11, fill: '#9CA3AF' }} />
            <YAxis tick={{ fontSize: 10, fill: '#9CA3AF' }} tickFormatter={(v) => '$' + fmtInt(v)} />
            <Tooltip formatter={(v) => fmt(v)} contentStyle={{ fontSize: 12, borderRadius: 12 }} />
            <Legend wrapperStyle={{ fontSize: 11 }} />
            {!esDeuda && <ReferenceLine y={objetivo} stroke="#9CA3AF" strokeDasharray="4 4" label={{ value: 'Meta', fontSize: 10, fill: '#9CA3AF' }} />}
            <Line type="monotone" dataKey="Base" stroke="#9CA3AF" strokeWidth={2} dot={false} />
            <Line type="monotone" dataKey="Con abonos extra" stroke="#12B76A" strokeWidth={2} dot={false} />
          </LineChart>
        </ResponsiveContainer>
      </div>
    </Modal>
  );
}

    {
      key: 'tarjeta', label: 'Tarjeta de crédito', icon: CreditCard, tipo: 'deuda', tipoSim: 'deuda',
      meses: resultados.tarjeta.meses, interes: resultados.tarjeta.totalInteres, editable: true, tasaKey: 'tarjeta',
      nuncaPaga: resultados.tarjeta.nuncaPaga,
      nota: 'Mismo monto, tasa mucho más alta: el costo real cambia radicalmente.',
    },
  ];

  return (
    <div className="space-y-6">
      <div className="rounded-2xl bg-[#F1EDFF] border border-[#5B3DF5]/15 p-4 flex items-start gap-2">
        <Target size={18} className="mt-0.5 flex-shrink-0 text-[#5B3DF5]" />
        <p className="text-sm text-gray-700">Ingresa un monto que quieres conseguir o gastar, y cuánto puedes aportar o pagar cada mes. Verás, con el mismo par de números, cinco caminos financieros distintos y en cuántos meses llegas a la meta — o sales de la deuda. Toca "Analizar" en cualquiera para probar pagos extraordinarios.</p>
      </div>

      <div className="grid sm:grid-cols-2 gap-4 bg-white p-4 rounded-2xl border border-[#EDEAFB]">
        <Field label="Monto objetivo" suffix="$" value={objetivo} onChange={setObjetivo} min={1} step={100} />
        <Field label="Capacidad mensual (aporte o pago)" suffix="$" value={capacidad} onChange={setCapacidad} min={1} step={10} />
      </div>

      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {paths.map((p) => {
          const Icon = p.icon;
          const isDeuda = p.tipo === 'deuda';
          return (
            <div key={p.key} className={`bg-white border-2 rounded-2xl p-4 flex flex-col gap-3 ${isDeuda ? 'border-[#FFC4B8]' : 'border-[#F1EFFC]'}`}>
              <div className="flex items-center gap-2">
                <div className={`p-1.5 rounded-full ${isDeuda ? 'bg-[#FFE8E3] text-[#C23E28]' : 'bg-[#E3FBEF] text-[#067A48]'}`}>
                  <Icon size={16} />
                </div>
                <span className="font-semibold text-[#1A1533] text-sm" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>{p.label}</span>
              </div>
              {p.editable && (
                <label className="flex items-center gap-2 text-xs text-gray-500">
                  Tasa anual
                  <input
                    type="number"
                    value={tasas[p.tasaKey]}
                    onChange={setTasa(p.tasaKey)}
                    className="w-16 border-2 border-[#EDEAFB] rounded-lg px-1.5 py-0.5 text-[#1A1533]"
                    style={{ fontFamily: "'JetBrains Mono', monospace" }}
                  />
                  %
                </label>
              )}
              {p.nuncaPaga ? (
                <div className="flex items-start gap-1.5 text-[#C23E28] text-sm bg-[#FFE8E3] rounded-xl px-3 py-2">
                  <AlertTriangle size={14} className="mt-0.5 flex-shrink-0" />
                  Tu pago mensual no cubre ni el interés: la deuda nunca se termina de pagar.
                </div>
              ) : (
                <>
                  <div>
                    <div className="text-[11px] uppercase tracking-wide text-gray-500">{isDeuda ? 'Tiempo para pagarla' : 'Tiempo para lograrlo'}</div>
                    <div className="text-lg" style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600 }}>{monthsToYears(p.meses)}</div>
                  </div>
                  <div>
                    <div className="text-[11px] uppercase tracking-wide text-gray-500">{isDeuda ? 'Interés total pagado' : 'Interés total ganado'}</div>
                    <div className={`text-sm font-semibold ${isDeuda ? 'text-[#C23E28]' : 'text-[#067A48]'}`}>{fmt(p.interes)}</div>
                  </div>
                </>
              )}
              <p className="text-xs text-gray-500 mt-auto pt-2 border-t border-[#F1EFFC]">{p.nota}</p>
              <button
                onClick={() => setDetalle(p)}
                className="flex items-center justify-center gap-1.5 text-xs font-semibold py-2 rounded-full text-white hover:opacity-90 transition-opacity"
                style={{ background: 'linear-gradient(135deg, #5B3DF5, #4530B8)' }}
              >
                Analizar este destino <RotateCcw size={12} />
              </button>
            </div>
          );
        })}
      </div>

      <div className="grid sm:grid-cols-2 gap-4">
        <div>
          <div className="text-xs uppercase tracking-wide text-gray-500 font-semibold mb-2">Caminos de ahorro (llegar al objetivo)</div>
          <div className="bg-white border border-[#EDEAFB] rounded-2xl p-3" style={{ height: 240 }}>
            <ResponsiveContainer width="100%" height="100%">
              <LineChart data={ahorroChart} margin={{ top: 8, right: 8, left: 0, bottom: 0 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="#EEF0F0" vertical={false} />
                <XAxis dataKey="mes" tick={{ fontSize: 10, fill: '#9CA3AF' }} label={{ value: 'Meses', position: 'insideBottom', offset: -2, fontSize: 11, fill: '#9CA3AF' }} />
                <YAxis tick={{ fontSize: 10, fill: '#9CA3AF' }} tickFormatter={(v) => '$' + fmtInt(v)} />
                <Tooltip formatter={(v) => fmt(v)} contentStyle={{ fontSize: 12, borderRadius: 12 }} />
                <Legend wrapperStyle={{ fontSize: 11 }} />
                <ReferenceLine y={objetivo} stroke="#374151" strokeDasharray="4 4" label={{ value: 'Meta', fontSize: 10, fill: '#374151' }} />
                <Line type="monotone" dataKey="Alcancía" stroke="#9CA3AF" strokeWidth={2} dot={false} />
                <Line type="monotone" dataKey="Ahorro simple" stroke="#5B3DF5" strokeWidth={2} dot={false} />
                <Line type="monotone" dataKey="Ahorro compuesto" stroke="#12B76A" strokeWidth={2} dot={false} />
              </LineChart>
            </ResponsiveContainer>
          </div>
        </div>
        <div>
          <div className="text-xs uppercase tracking-wide text-gray-500 font-semibold mb-2">Caminos de deuda (llegar a saldo cero)</div>
          <div className="bg-white border border-[#EDEAFB] rounded-2xl p-3" style={{ height: 240 }}>
            <ResponsiveContainer width="100%" height="100%">
              <LineChart data={deudaChart} margin={{ top: 8, right: 8, left: 0, bottom: 0 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="#EEF0F0" vertical={false} />
                <XAxis dataKey="mes" tick={{ fontSize: 10, fill: '#9CA3AF' }} label={{ value: 'Meses', position: 'insideBottom', offset: -2, fontSize: 11, fill: '#9CA3AF' }} />
                <YAxis tick={{ fontSize: 10, fill: '#9CA3AF' }} tickFormatter={(v) => '$' + fmtInt(v)} />
                <Tooltip formatter={(v) => fmt(v)} contentStyle={{ fontSize: 12, borderRadius: 12 }} />
                <Legend wrapperStyle={{ fontSize: 11 }} />
                <Line type="monotone" dataKey="Préstamo" stroke="#5B3DF5" strokeWidth={2} dot={false} />
                <Line type="monotone" dataKey="Tarjeta de crédito" stroke="#FF6A55" strokeWidth={2} dot={false} />
              </LineChart>
            </ResponsiveContainer>
          </div>
        </div>
      </div>

      {detalle && (
        <DestinoDetalleModal
          path={detalle}
          objetivo={objetivo}
          capacidad={capacidad}
          tasaAnual={detalle.tasaKey ? tasas[detalle.tasaKey] : 0}
          onClose={() => setDetalle(null)}
        />
      )}
    </div>
  );
}

// ---------- App principal ----------
function FinanzasApp() {
  const [tab, setTab] = useState('calculadoras');

  return (
    <div
      className="min-h-screen w-full"
      style={{
        background:
          'radial-gradient(1100px 500px at 85% -10%, rgba(91,61,245,0.10), transparent 60%), radial-gradient(900px 500px at -10% 10%, rgba(18,183,106,0.08), transparent 55%), #FAFAFC',
      }}
    >
      <div className="max-w-5xl mx-auto px-4 py-6 sm:py-8" style={{ fontFamily: "'Inter', sans-serif" }}>
        <header
          className="relative overflow-hidden rounded-3xl mb-5 px-5 py-6 sm:px-8 sm:py-8"
          style={{ background: 'linear-gradient(135deg, #5B3DF5 0%, #7C5CFF 55%, #4530B8 100%)' }}
        >
          <svg
            className="absolute inset-0 w-full h-full opacity-40 pointer-events-none"
            viewBox="0 0 800 220"
            preserveAspectRatio="none"
          >
            <path
              d="M -20 190 C 150 150, 220 230, 380 150 S 620 30, 820 70"
              fill="none"
              stroke="#FFC53D"
              strokeWidth="2.5"
              className="route-line"
              strokeLinecap="round"
            />
            <circle cx="380" cy="150" r="5" fill="#FFC53D" />
            <circle cx="620" cy="60" r="5" fill="#FFC53D" opacity="0.85" />
            <circle cx="150" cy="150" r="4" fill="#FFFFFF" opacity="0.6" />
          </svg>
          <div className="relative">
            <div className="inline-flex items-center gap-2 text-[#FFE9A8] text-xs uppercase tracking-[0.15em] font-semibold mb-3 bg-white/10 rounded-full px-3 py-1">
              <Calculator size={14} /> Matemáticas discretas · finanzas para todos
            </div>
            <h1 className="text-3xl sm:text-4xl text-white" style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700 }}>
              Cuaderno de matemáticas financieras
            </h1>
            <p className="text-white/80 text-sm mt-2 max-w-2xl leading-relaxed">
              Aprende cómo funcionan el interés simple, el interés compuesto y los préstamos en cuotas — con explicaciones simples, fórmulas claras, y una calculadora que te muestra exactamente cómo se obtuvo cada número.
            </p>
          </div>
        </header>

        <div className="flex gap-2 mb-4">
          <TabButton active={tab === 'calculadoras'} onClick={() => setTab('calculadoras')} icon={Calculator}>Calculadoras</TabButton>
          <TabButton active={tab === 'simulador'} onClick={() => setTab('simulador')} icon={Target}>Simulador de destinos</TabButton>
        </div>
        <div className="bg-white rounded-3xl border border-[#EDEAFB] p-4 sm:p-6 shadow-xl shadow-[#5B3DF5]/[0.06]">
          {tab === 'calculadoras' ? <CalculadorasTab /> : <SimuladorTab />}
        </div>

        <footer className="text-center text-[11px] text-gray-400 mt-6">
          Prototipo educativo · las cifras son ilustrativas y no constituyen asesoría financiera.
        </footer>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<FinanzasApp />);
</script>
</body>
</html>
