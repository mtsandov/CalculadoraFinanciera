// ---------- Utilidades ----------
const fmt = (n) => {
  if (!isFinite(n)) return '—';
  return '$' + n.toLocaleString('es-EC', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
const fmtInt = (n) => n.toLocaleString('es-EC', { maximumFractionDigits: 0 });
const monthsToYears = (m) => {
  if (!isFinite(m)) return '—';
  const y = Math.floor(m / 12);
  const rem = Math.round(m % 12);
  if (y === 0) return `${rem} ${rem === 1 ? 'mes' : 'meses'}`;
  if (rem === 0) return `${y} ${y === 1 ? 'año' : 'años'}`;
  return `${y} ${y === 1 ? 'año' : 'años'} y ${rem} ${rem === 1 ? 'mes' : 'meses'}`;
};

// ---------- Motores de cálculo: amortización y simulación ----------
function calcularAmortizacion(P, r, n, sistema) {
  const rows = [];
  let saldo = P;
  if (sistema === 'francesa') {
    const pago = (P * r) / (1 - Math.pow(1 + r, -n));
    for (let t = 1; t <= n; t++) {
      const interes = saldo * r;
      let capital = pago - interes;
      let saldoFinal = saldo - capital;
      if (t === n) { capital += saldoFinal; saldoFinal = 0; }
      rows.push({ t, saldoInicial: saldo, pago, interes, capital, saldoFinal });
      saldo = saldoFinal;
    }
  } else if (sistema === 'alemana') {
    const capitalFijo = P / n;
    for (let t = 1; t <= n; t++) {
      const interes = saldo * r;
      const pago = capitalFijo + interes;
      const saldoFinal = Math.max(0, saldo - capitalFijo);
      rows.push({ t, saldoInicial: saldo, pago, interes, capital: capitalFijo, saldoFinal });
      saldo = saldoFinal;
    }
  } else { 
    for (let t = 1; t <= n; t++) {
      const interes = saldo * r;
      const capital = t === n ? saldo : 0;
      const pago = interes + capital;
      const saldoFinal = saldo - capital;
      rows.push({ t, saldoInicial: saldo, pago, interes, capital, saldoFinal });
      saldo = saldoFinal;
    }
  }
  return { rows, totalInteres: rows.reduce((a, b) => a + b.interes, 0) };
}

function calcularSimple(P, r, n) {
  const rows = [];
  let saldo = P;
  for (let t = 1; t <= n; t++) {
    const interes = P * r;
    const saldoFinal = saldo + interes;
    rows.push({ t, saldoInicial: saldo, interes, capital: P, saldoFinal });
    saldo = saldoFinal;
  }
  return { rows, totalInteres: rows.reduce((a, b) => a + b.interes, 0), saldoFinal: saldo };
}

function calcularCompuesto(P, r, n) {
  const rows = [];
  let saldo = P;
  for (let t = 1; t <= n; t++) {
    const interes = saldo * r;
    const saldoFinal = saldo + interes;
    rows.push({ t, saldoInicial: saldo, interes, capital: P, saldoFinal });
    saldo = saldoFinal;
  }
  return { rows, totalInteres: rows.reduce((a, b) => a + b.interes, 0), saldoFinal: saldo };
}

function simularCamino({ tipo, monto, base, tasaAnual = 0, extraMensual = 0, extrasUnicos = [], maxMeses = 1200 }) {
  const r = tasaAnual / 100 / 12;
  const aporteExtra = (m) =>
    extraMensual + extrasUnicos.reduce((acc, e) => acc + (m === e.mes ? (e.monto || 0) : 0), 0);

  if (tipo === 'alcancia') {
    let saldo = 0;
    const serie = [{ mes: 0, saldo: 0 }];
    for (let m = 1; m <= maxMeses; m++) {
      saldo += base + aporteExtra(m);
      serie.push({ mes: m, saldo: Math.min(saldo, monto) });
      if (saldo >= monto) return { meses: m, totalInteres: 0, serie, alcanzado: true };
    }
    return { meses: Infinity, totalInteres: 0, serie, alcanzado: false };
  }

  if (tipo === 'ahorroSimple') {
    let principal = 0, interesAcum = 0;
    const serie = [{ mes: 0, saldo: 0 }];
    for (let m = 1; m <= maxMeses; m++) {
      principal += base + aporteExtra(m);
      interesAcum += principal * r;
      const saldo = principal + interesAcum;
      serie.push({ mes: m, saldo });
      if (saldo >= monto) return { meses: m, totalInteres: interesAcum, serie, alcanzado: true };
    }
    return { meses: Infinity, totalInteres: interesAcum, serie, alcanzado: false };
  }

  if (tipo === 'ahorroCompuesto') {
    let saldo = 0, aportado = 0;
    const serie = [{ mes: 0, saldo: 0 }];
    for (let m = 1; m <= maxMeses; m++) {
      const aporte = base + aporteExtra(m);
      saldo = saldo * (1 + r) + aporte;
      aportado += aporte;
      serie.push({ mes: m, saldo });
      if (saldo >= monto) return { meses: m, totalInteres: saldo - aportado, serie, alcanzado: true };
    }
    return { meses: Infinity, totalInteres: saldo - aportado, serie, alcanzado: false };
  }

  let saldo = monto, interesTotal = 0;
  const serie = [{ mes: 0, saldo }];
  const hayExtraUnico = extrasUnicos.some((e) => (e.monto || 0) > 0);
  if (base + extraMensual <= saldo * r && !hayExtraUnico) {
    return { meses: Infinity, totalInteres: Infinity, serie, nuncaPaga: true };
  }
  for (let m = 1; m <= maxMeses; m++) {
    const interes = saldo * r;
    interesTotal += interes;
    const pago = base + aporteExtra(m);
    saldo = saldo + interes - pago;
    if (saldo < 0) saldo = 0;
    serie.push({ mes: m, saldo });
    if (saldo <= 0) return { meses: m, totalInteres: interesTotal, serie, nuncaPaga: false };
  }
  return { meses: Infinity, totalInteres: interesTotal, serie, nuncaPaga: false };
}

function TemaIntro({ tipo, sistema }) {
  const content = {
    simple: {
      titulo: '¿Qué es el interés simple?', color: 'teal',
      texto: 'Es la forma más sencilla de interés: cada periodo ganas (o pagas) exactamente lo mismo, calculado siempre sobre el monto inicial.',
      formulas: [{ nombre: 'Monto final', expr: 'F = P · (1 + r · t)' }, { nombre: 'Interés generado', expr: 'I = P · r · t' }],
      variables: 'P = capital inicial · r = tasa por periodo · t = número de periodos · F = monto final',
    },
    compuesto: {
      titulo: '¿Qué es el interés compuesto?', color: 'teal',
      texto: 'Aquí el interés se calcula sobre el saldo acumulado, no solo sobre el monto inicial. Es "interés sobre interés".',
      formulas: [{ nombre: 'Monto final', expr: 'F = P · (1 + r)ᵗ' }],
      variables: 'P = capital inicial · r = tasa por periodo · t = número de periodos · F = monto final',
    },
    anualidad: {
      titulo: '¿Qué es una anualidad?', color: 'blue',
      texto: 'Una anualidad es una serie de pagos a intervalos regulares que sirven para amortizar un préstamo.',
      formulas: [
        { nombre: 'Francesa (cuota fija)', expr: 'Pago = P · r / (1 − (1+r)⁻ⁿ)', activo: sistema === 'francesa' },
        { nombre: 'Alemana (capital fijo)', expr: 'Capital = P / n', activo: sistema === 'alemana' },
        { nombre: 'Americana (bullet)', expr: 'Pago = Interés; Capital todo al final', activo: sistema === 'americana' },
      ],
      variables: 'P = monto del préstamo · r = tasa por periodo · n = número de periodos',
    },
  };
  const c = content[tipo];
  const ring = c.color === 'teal' ? 'border-[#12B76A]/20 bg-[#E3FBEF]' : 'border-[#7C5CFF]/20 bg-[#F1EDFF]';
  const dot = c.color === 'teal' ? 'text-[#067A48]' : 'text-[#5B3DF5]';

  return (
    <div className={`rounded-2xl border ${ring} p-5 mb-5`}>

    </div>

function explicacionFila(row, tipo, sistema, r) {
  if (tipo === 'anualidad') {
    if (sistema === 'francesa') return [`Interés = Saldo anterior × r = ${fmt(row.saldoInicial)} × ${r.toFixed(5)} = ${fmt(row.interes)}`, `Capital = Pago − Interés = ${fmt(row.pago)} − ${fmt(row.interes)} = ${fmt(row.capital)}`, `Saldo nuevo = Saldo anterior − Capital = ${fmt(row.saldoInicial)} − ${fmt(row.capital)} = ${fmt(row.saldoFinal)}`];
    if (sistema === 'alemana') return [`Capital fijo = P / n = ${fmt(row.capital)}`, `Interés = Saldo anterior × r = ${fmt(row.saldoInicial)} × ${r.toFixed(5)} = ${fmt(row.interes)}`, `Pago = Capital + Interés = ${fmt(row.capital)} + ${fmt(row.interes)} = ${fmt(row.pago)}`];
    return [`Interés = Saldo × r = ${fmt(row.saldoInicial)} × ${r.toFixed(5)} = ${fmt(row.interes)}`, row.capital > 0 ? `Se devuelve todo el capital = ${fmt(row.capital)}` : `Capital abonado este periodo = ${fmt(row.capital)}`, `Pago total = Interés + Capital = ${fmt(row.pago)}`];
  }
  if (tipo === 'simple') return [`Interés = P × r = ${fmt(row.capital)} × ${r.toFixed(5)} = ${fmt(row.interes)}`, `Saldo nuevo = Saldo anterior + Interés = ${fmt(row.saldoInicial)} + ${fmt(row.interes)} = ${fmt(row.saldoFinal)}`];
  return [`Interés = Saldo anterior × r = ${fmt(row.saldoInicial)} × ${r.toFixed(5)} = ${fmt(row.interes)}`, `Saldo nuevo = Saldo anterior × (1 + r) = ${fmt(row.saldoInicial)} × ${(1 + r).toFixed(5)} = ${fmt(row.saldoFinal)}`];
}

function FilaDetalleModal({ row, rows, tipo, sistema, r, onClose }) {
  const historia = rows.slice(0, row.t).map((rr) => ({ periodo: rr.t, Interés: rr.interes, Capital: rr.capital, Saldo: rr.saldoFinal }));
  const lineas = explicacionFila(row, tipo, sistema, r);
  return (
    <Modal onClose={onClose} wide>
      <div className="flex items-center gap-2 text-[#4530B8] font-semibold text-sm mb-1" style={{ fontFamily: "'Space Grotesk', sans-serif" }}><Eye size={16} /> Periodo {row.t}</div>
      <h3 className="text-2xl text-[#1A1533] mb-4" style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600 }}>Así se calculó este registro</h3>
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-5">
        <StatCard label="Saldo inicial" value={fmt(row.saldoInicial)} accent="blue" />
        <StatCard label="Interés" value={fmt(row.interes)} accent="coral" />
        <StatCard label="Capital" value={fmt(row.capital)} accent="teal" />
        <StatCard label="Saldo final" value={fmt(row.saldoFinal)} accent="blue" />
      </div>
      <div className="bg-[#F7F5FF] rounded-2xl p-4 mb-5 space-y-2" style={{ fontFamily: "'JetBrains Mono', monospace" }}>
        {lineas.map((l, i) => <p key={i} className="text-[13px] text-gray-700 leading-relaxed">{l}</p>)}
      </div>
      <div className="text-xs uppercase tracking-wide text-gray-500 font-semibold mb-2">Evolución hasta este periodo</div>
      <div className="bg-white border border-[#EDEAFB] rounded-2xl p-3" style={{ height: 220 }}>
        <ResponsiveContainer width="100%" height="100%">
          <LineChart data={historia} margin={{ top: 8, right: 8, left: 0, bottom: 0 }}>
            <CartesianGrid strokeDasharray="3 3" stroke="#EEF0F0" vertical={false} />
            <XAxis dataKey="periodo" tick={{ fontSize: 10, fill: '#9CA3AF' }} />
            <YAxis tick={{ fontSize: 10, fill: '#9CA3AF' }} tickFormatter={(v) => '$' + fmtInt(v)} />
            <Tooltip formatter={(v) => fmt(v)} contentStyle={{ fontSize: 12, borderRadius: 12 }} />
            <Legend wrapperStyle={{ fontSize: 11 }} />
            <Line type="monotone" dataKey="Saldo" stroke="#5B3DF5" strokeWidth={2} dot={false} />
            <Line type="monotone" dataKey="Interés" stroke="#FF6A55" strokeWidth={2} dot={false} />
            <Line type="monotone" dataKey="Capital" stroke="#12B76A" strokeWidth={2} dot={false} />
          </LineChart>
        </ResponsiveContainer>
      </div>
    </Modal>
  );
}

function FilaTabla({ row, tipo, sistema, r, onVer }) {

// ---------- Tab 2: Valor Futuro / Valor Presente ----------
function ValorTiempoTab() {
  const [calculo, setCalculo] = useState('futuro');
  const [interes, setInteres] = useState('compuesto');
  const [monto, setMonto] = useState(10000);
  const [tasa, setTasa] = useState(5);
  const [n, setN] = useState(12);

  const r = tasa / 100;

  const resultados = useMemo(() => {
    let resultado = 0;
    let interesTotal = 0;
    const serie = [];

    if (calculo === 'futuro') {
      for (let t = 0; t <= n; t++) {
        let valorEnT = interes === 'simple' ? monto * (1 + r * t) : monto * Math.pow(1 + r, t);
        serie.push({ periodo: t, valor: valorEnT });
      }
      resultado = serie[n].valor;
      interesTotal = resultado - monto;
    } else {
      let P = interes === 'simple' ? monto / (1 + r * n) : monto / Math.pow(1 + r, n);
      for (let t = 0; t <= n; t++) {
        let valorEnT = interes === 'simple' ? P * (1 + r * t) : P * Math.pow(1 + r, t);
        serie.push({ periodo: t, valor: valorEnT });
      }
      resultado = P;
      interesTotal = monto - resultado;
    }
    return { resultado, interesTotal, serie };
  }, [calculo, interes, monto, tasa, n]);

  return (
    <div className="space-y-6">
      <div className="rounded-2xl border border-[#12B76A]/20 bg-[#E3FBEF] p-5 mb-5">
        <div className="flex items-center gap-2 font-semibold text-[15px] mb-2 text-[#067A48]" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>
          <Sparkles size={16} /> El valor del dinero en el tiempo
        </div>
        <p className="text-sm text-gray-700 leading-relaxed mb-2">
          Dinero hoy no vale lo mismo que dinero mañana. Esta herramienta te permite proyectar cuánto valdrá tu dinero en el futuro (Valor Futuro) o cuánto dinero necesitas hoy para alcanzar una meta futura (Valor Presente).
        </p>
      </div>

      <div className="flex flex-wrap gap-2">
        <PillButton active={calculo === 'futuro'} onClick={() => setCalculo('futuro')}>Calcular Valor Futuro (F)</PillButton>
        <PillButton active={calculo === 'presente'} onClick={() => setCalculo('presente')}>Calcular Valor Presente (P)</PillButton>
      </div>
      <div className="flex flex-wrap gap-2">
        <PillButton active={interes === 'simple'} onClick={() => setInteres('simple')}>Interés Simple</PillButton>
        <PillButton active={interes === 'compuesto'} onClick={() => setInteres('compuesto')}>Interés Compuesto</PillButton>
      </div>

      <div className="grid sm:grid-cols-3 gap-4 bg-white p-4 rounded-2xl border border-[#EDEAFB]">
        <Field label={calculo === 'futuro' ? 'Valor Presente (P)' : 'Valor Futuro (F)'} value={monto} onChange={setMonto} min={0} step={100} />
        <Field label="Tasa de interés por periodo" suffix="%" value={tasa} onChange={setTasa} min={0} step={0.1} />
        <Field label="Número de periodos (t)" value={n} onChange={(v) => setN(Math.max(1, Math.round(v)))} min={1} step={1} />
      </div>

      <div className="grid sm:grid-cols-2 gap-3">
        <StatCard label={calculo === 'futuro' ? 'Valor Futuro Calculado (F)' : 'Valor Presente Calculado (P)'} value={fmt(resultados.resultado)} accent="blue" />
        <StatCard label="Interés Generado" value={fmt(resultados.interesTotal)} accent="coral" />
      </div>

      <div>
        <div className="text-xs uppercase tracking-wide text-gray-500 font-semibold mb-2">Evolución del valor en el tiempo</div>
        <div className="bg-white border border-[#EDEAFB] rounded-2xl p-3" style={{ height: 260 }}>
          <ResponsiveContainer width="100%" height="100%">
            <LineChart data={resultados.serie} margin={{ top: 8, right: 8, left: 0, bottom: 0 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="#EEF0F0" vertical={false} />
              <XAxis dataKey="periodo" tick={{ fontSize: 11, fill: '#9CA3AF' }} label={{ value: 'Periodos', position: 'insideBottom', offset: -2, fontSize: 11, fill: '#9CA3AF' }} />
              <YAxis tick={{ fontSize: 11, fill: '#9CA3AF' }} tickFormatter={(v) => '$' + fmtInt(v)} />
              <Tooltip formatter={(v) => fmt(v)} contentStyle={{ fontSize: 12, borderRadius: 12 }} />
              <Line type="monotone" dataKey="valor" stroke="#5B3DF5" strokeWidth={3} dot={false} name="Valor" />
            </LineChart>
          </ResponsiveContainer>
        </div>
      </div>
    </div>
  );
}

// ---------- Tab 3: Tasas Equivalentes ----------
function TasasEquivalentesTab() {
  const opcionesPeriodo = [
    { id: 'anual', label: 'Anual', m: 1 },
    { id: 'semestral', label: 'Semestral', m: 2 },
    { id: 'cuatrimestral', label: 'Cuatrimestral', m: 3 },
    { id: 'trimestral', label: 'Trimestral', m: 4 },
    { id: 'bimestral', label: 'Bimestral', m: 6 },
    { id: 'mensual', label: 'Mensual', m: 12 },
    { id: 'quincenal', label: 'Quincenal', m: 24 },
    { id: 'diaria', label: 'Diaria (360)', m: 360 }
  ];

  const [tasaOrigen, setTasaOrigen] = useState(12);
  const [tieneCapOrigen, setTieneCapOrigen] = useState(false);
  const [perOrigen, setPerOrigen] = useState('anual'); 
  const [capOrigen, setCapOrigen] = useState('mensual'); 

  const [tieneCapDestino, setTieneCapDestino] = useState(false);
  const [perDestino, setPerDestino] = useState('mensual');
  const [capDestino, setCapDestino] = useState('diaria');

  const calcularTasaDestino = () => {
    let r = tasaOrigen / 100;
    let EA = 0;

    // 1. Llevar Origen a Efectiva Anual (EA)
    if (!tieneCapOrigen) {
      let mEfectivo = opcionesPeriodo.find(o => o.id === perOrigen).m;
      EA = Math.pow(1 + r, mEfectivo) - 1;
    } else {
      let mCap = opcionesPeriodo.find(o => o.id === capOrigen).m;
      EA = Math.pow(1 + r / mCap, mCap) - 1;
    }

    // 2. Llevar EA a Destino
    let resultado = 0;
    if (!tieneCapDestino) {
      let mEfectivo = opcionesPeriodo.find(o => o.id === perDestino).m;
      resultado = Math.pow(1 + EA, 1 / mEfectivo) - 1;
    } else {
      let mCap = opcionesPeriodo.find(o => o.id === capDestino).m;
      resultado = mCap * (Math.pow(1 + EA, 1 / mCap) - 1);
    }
    return resultado * 100;
  };

  return (
    <div className="space-y-6">
      <div className="rounded-2xl border border-[#7C5CFF]/20 bg-[#F1EDFF] p-5 mb-5">
        <div className="flex items-center gap-2 font-semibold text-[15px] mb-2 text-[#5B3DF5]" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>
          <PercentIcon size={16} /> Conversión de Tasas Equivalentes
        </div>
        <p className="text-sm text-gray-700 leading-relaxed mb-2">
          Garantiza que el dinero rinda lo mismo, sin importar cómo se exprese el interés. Si marcas la casilla <b>"Tiene capitalización"</b>, el sistema asume una Tasa Nominal Anual (TNA) con la frecuencia seleccionada. Si no lo marcas, se calculará directamente sobre una Tasa Efectiva.
        </p>
      </div>

      <div className="grid md:grid-cols-2 gap-6">
        {/* ORIGEN */}
        <div className="bg-white p-5 rounded-2xl border-2 border-[#EDEAFB]">
          <div className="text-sm font-semibold text-[#1A1533] mb-4 uppercase tracking-wide">Tasa de Origen</div>
          <div className="space-y-4">
            <Field label="Valor de la Tasa" suffix="%" value={tasaOrigen} onChange={setTasaOrigen} min={0} step={0.1} />

            <label className="flex items-center gap-2 cursor-pointer mt-2">
              <input type="checkbox" checked={tieneCapOrigen} onChange={(e) => setTieneCapOrigen(e.target.checked)} className="w-4 h-4 text-[#5B3DF5] rounded border-gray-300 focus:ring-[#5B3DF5]" />
              <span className="text-sm text-gray-700 font-medium">¿Tiene capitalización? (Tasa Nominal)</span>
            </label>

            {!tieneCapOrigen ? (
              <label className="flex flex-col gap-1">
                <span className="text-xs uppercase tracking-wide text-gray-500 font-semibold">Periodo de la tasa efectiva</span>
                <select value={perOrigen} onChange={(e) => setPerOrigen(e.target.value)} className="border-2 border-[#EDEAFB] rounded-xl px-3 py-2.5 bg-white text-[#1A1533]">
                  {opcionesPeriodo.map(o => <option key={o.id} value={o.id}>{o.label}</option>)}
                </select>
              </label>
            ) : (
              <label className="flex flex-col gap-1">
                <span className="text-xs uppercase tracking-wide text-gray-500 font-semibold">Se capitaliza de forma...</span>
                <select value={capOrigen} onChange={(e) => setCapOrigen(e.target.value)} className="border-2 border-[#EDEAFB] rounded-xl px-3 py-2.5 bg-white text-[#1A1533]">
                  {opcionesPeriodo.map(o => <option key={o.id} value={o.id}>{o.label}</option>)}
                </select>
              </label>
            )}
          </div>
        </div>

        {/* DESTINO */}
        <div className="bg-white p-5 rounded-2xl border-2 border-[#C9BFF7] shadow-sm shadow-[#5B3DF5]/10 relative">
          <div className="absolute -left-5 top-1/2 -translate-y-1/2 bg-white rounded-full p-1 border border-[#EDEAFB] hidden md:block">
            <ArrowRight size={20} className="text-[#5B3DF5]" />
          </div>
          <div className="text-sm font-semibold text-[#5B3DF5] mb-4 uppercase tracking-wide">Tasa Equivalente (Destino)</div>
          <div className="space-y-4">

            <label className="flex items-center gap-2 cursor-pointer mt-2">
              <input type="checkbox" checked={tieneCapDestino} onChange={(e) => setTieneCapDestino(e.target.checked)} className="w-4 h-4 text-[#5B3DF5] rounded border-gray-300 focus:ring-[#5B3DF5]" />
              <span className="text-sm text-gray-700 font-medium">¿Buscar con capitalización? (Tasa Nominal)</span>
            </label>

            {!tieneCapDestino ? (
              <label className="flex flex-col gap-1">
                <span className="text-xs uppercase tracking-wide text-gray-500 font-semibold">Periodo de la tasa efectiva buscada</span>
                <select value={perDestino} onChange={(e) => setPerDestino(e.target.value)} className="border-2 border-[#EDEAFB] rounded-xl px-3 py-2.5 bg-white text-[#1A1533]">
                  {opcionesPeriodo.map(o => <option key={o.id} value={o.id}>{o.label}</option>)}
                </select>
              </label>
            ) : (
              <label className="flex flex-col gap-1">
                <span className="text-xs uppercase tracking-wide text-gray-500 font-semibold">Que se capitalice de forma...</span>
                <select value={capDestino} onChange={(e) => setCapDestino(e.target.value)} className="border-2 border-[#EDEAFB] rounded-xl px-3 py-2.5 bg-white text-[#1A1533]">
                  {opcionesPeriodo.map(o => <option key={o.id} value={o.id}>{o.label}</option>)}
                </select>
              </label>
            )}
          </div>
        </div>
      </div>

      <div className="bg-[#F1EDFF] border border-[#5B3DF5]/20 rounded-2xl p-6 text-center">
        <div className="text-xs uppercase tracking-wide text-gray-500 font-semibold mb-2">Tasa Equivalente Resultante</div>
        <div className="text-3xl sm:text-4xl font-semibold text-[#4530B8]" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>
          {calcularTasaDestino().toLocaleString('es-EC', { minimumFractionDigits: 4, maximumFractionDigits: 6 })}%
        </div>
        <div className="text-sm text-gray-600 mt-2 font-medium">
          {tieneCapDestino ? 'Tasa Nominal Anual (TNA)' : 'Tasa Efectiva'}
        </div>
      </div>
    </div>
  );
}

  const base = useMemo(() => simularCamino({ tipo: path.tipoSim, monto: objetivo, base: capacidad, tasaAnual }), [path, objetivo, capacidad, tasaAnual]);

          {extrasUnicos.length === 0 && <p className="text-xs text-gray-400 italic">Sin pagos puntuales — agrega uno con el botón de arriba.</p>}
          <div className="grid sm:grid-cols-2 gap-3">
            {extrasUnicos.map((extra, i) => (
              <div key={extra.id} className="relative bg-white border border-[#E3DBFF] rounded-2xl p-3 pt-3.5">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-[11px] uppercase tracking-wide text-[#5B3DF5] font-semibold">Extra #{i + 1}</span>
                  <button onClick={() => quitarExtra(extra.id)} className="p-1 rounded-full text-gray-400 hover:bg-[#FFE8E3] hover:text-[#C23E28]"><X size={13} /></button>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <Field label={esDeuda ? 'Pago único' : 'Monto'} suffix="$" value={extra.monto} onChange={actualizarExtra(extra.id, 'monto')} min={0} step={50} />
                  <Field label="En el mes" value={extra.mes} onChange={(v) => actualizarExtra(extra.id, 'mes')(Math.max(1, Math.round(v)))} min={1} step={1} />
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="grid sm:grid-cols-2 gap-3 mb-5">
        <div className="rounded-2xl border border-[#EDEAFB] p-4">
          <div className="text-[11px] uppercase tracking-wide text-gray-500 font-semibold mb-1">Escenario base</div>
          <div className="text-lg font-semibold text-[#1A1533]" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>{monthsToYears(base.meses)}</div>
          <div className="text-sm text-gray-500">{esDeuda ? 'interés pagado' : 'interés ganado'}: {fmt(base.totalInteres)}</div>
        </div>
        <div className="rounded-2xl border-2 border-[#12B76A] p-4 bg-[#E3FBEF]">
          <div className="text-[11px] uppercase tracking-wide text-[#067A48] font-semibold mb-1">Con tus extras</div>
          <div className="text-lg font-semibold text-[#067A48]" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>{monthsToYears(ajustado.meses)}</div>
          <div className="text-sm text-[#067A48]">{esDeuda ? 'interés pagado' : 'interés ganado'}: {fmt(ajustado.totalInteres)}</div>
        </div>
      </div>

      {(diffMeses !== 0 || diffInteres !== 0) && isFinite(diffMeses) && (
        <div className="flex items-center gap-2 text-sm text-[#067A48] bg-[#E3FBEF] rounded-xl px-4 py-3 mb-5">
          <ArrowRight size={16} />
          {esDeuda ? `Sales de la deuda ${monthsToYears(Math.max(0, diffMeses))} antes y te ahorras ${fmt(Math.max(0, diffInteres))} en intereses.` : `Llegas a tu meta ${monthsToYears(Math.max(0, diffMeses))} antes.`}
        </div>
      )}

      <div className="text-xs uppercase tracking-wide text-gray-500 font-semibold mb-2">Saldo mes a mes</div>
      <div className="bg-white border border-[#EDEAFB] rounded-2xl p-3" style={{ height: 220 }}>
        <ResponsiveContainer width="100%" height="100%">
          <LineChart data={chartData} margin={{ top: 8, right: 8, left: 0, bottom: 0 }}>
            <CartesianGrid strokeDasharray="3 3" stroke="#EEF0F0" vertical={false} />
            <XAxis dataKey="mes" tick={{ fontSize: 10, fill: '#9CA3AF' }} />
            <YAxis tick={{ fontSize: 10, fill: '#9CA3AF' }} tickFormatter={(v) => '$' + fmtInt(v)} />
            <Tooltip formatter={(v) => fmt(v)} contentStyle={{ fontSize: 12, borderRadius: 12 }} />
            <Legend wrapperStyle={{ fontSize: 11 }} />
            {!esDeuda && <ReferenceLine y={objetivo} stroke="#9CA3AF" strokeDasharray="4 4" />}
            <Line type="monotone" dataKey="Base" stroke="#9CA3AF" strokeWidth={2} dot={false} />
            <Line type="monotone" dataKey="Con abonos extra" stroke="#12B76A" strokeWidth={2} dot={false} />
          </LineChart>
        </ResponsiveContainer>
      </div>
    </Modal>
  );
}

function SimuladorTab() {
  const [objetivo, setObjetivo] = useState(5000);
  const [capacidad, setCapacidad] = useState(250);
  const [tasas, setTasas] = useState({ simple: 5, compuesto: 8, prestamo: 16, tarjeta: 42 });
  const [detalle, setDetalle] = useState(null);

  const resultados = useMemo(() => {
    return {
      alcancia: simularCamino({ tipo: 'alcancia', monto: objetivo, base: capacidad }),
      ahorroSimple: simularCamino({ tipo: 'ahorroSimple', monto: objetivo, base: capacidad, tasaAnual: tasas.simple }),
      ahorroCompuesto: simularCamino({ tipo: 'ahorroCompuesto', monto: objetivo, base: capacidad, tasaAnual: tasas.compuesto }),
      prestamo: simularCamino({ tipo: 'deuda', monto: objetivo, base: capacidad, tasaAnual: tasas.prestamo }),
      tarjeta: simularCamino({ tipo: 'deuda', monto: objetivo, base: capacidad, tasaAnual: tasas.tarjeta })
    };
  }, [objetivo, capacidad, tasas]);

  const paths = [
    { key: 'alcancia', label: 'Alcancía (sin interés)', icon: Wallet, tipo: 'ahorro', tipoSim: 'alcancia', meses: resultados.alcancia.meses, interes: 0, editable: false, nota: 'Guardas el dinero sin que gane nada.' },
    { key: 'simple', label: 'Ahorro a interés simple', icon: PiggyBank, tipo: 'ahorro', tipoSim: 'ahorroSimple', meses: resultados.ahorroSimple.meses, interes: resultados.ahorroSimple.totalInteres, editable: true, tasaKey: 'simple', nota: 'Tu aporte gana interés simple.' },
    { key: 'compuesto', label: 'Ahorro a interés compuesto', icon: TrendingUp, tipo: 'ahorro', tipoSim: 'ahorroCompuesto', meses: resultados.ahorroCompuesto.meses, interes: resultados.ahorroCompuesto.totalInteres, editable: true, tasaKey: 'compuesto', nota: 'Interés sobre interés.' },
    { key: 'prestamo', label: 'Préstamo bancario', icon: Landmark, tipo: 'deuda', tipoSim: 'deuda', meses: resultados.prestamo.meses, interes: resultados.prestamo.totalInteres, editable: true, tasaKey: 'prestamo', nuncaPaga: resultados.prestamo.nuncaPaga, nota: 'Recibes el monto y lo pagas en cuotas.' },
    { key: 'tarjeta', label: 'Tarjeta de crédito', icon: CreditCard, tipo: 'deuda', tipoSim: 'deuda', meses: resultados.tarjeta.meses, interes: resultados.tarjeta.totalInteres, editable: true, tasaKey: 'tarjeta', nuncaPaga: resultados.tarjeta.nuncaPaga, nota: 'Tasa mucho más alta.' }
  ];

  return (
    <div className="space-y-6">
      <div className="grid sm:grid-cols-2 gap-4 bg-white p-4 rounded-2xl border border-[#EDEAFB]">
        <Field label="Monto objetivo" suffix="$" value={objetivo} onChange={setObjetivo} min={1} step={100} />
        <Field label="Capacidad mensual (aporte o pago)" suffix="$" value={capacidad} onChange={setCapacidad} min={1} step={10} />
      </div>

      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {paths.map((p) => {
          const Icon = p.icon;
          const isDeuda = p.tipo === 'deuda';
          return (
            <div key={p.key} className={`bg-white border-2 rounded-2xl p-4 flex flex-col gap-3 ${isDeuda ? 'border-[#FFC4B8]' : 'border-[#F1EFFC]'}`}>
              <div className="flex items-center gap-2">
                <div className={`p-1.5 rounded-full ${isDeuda ? 'bg-[#FFE8E3] text-[#C23E28]' : 'bg-[#E3FBEF] text-[#067A48]'}`}><Icon size={16} /></div>
                <span className="font-semibold text-[#1A1533] text-sm" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>{p.label}</span>
              </div>
              {p.editable && (
                <label className="flex items-center gap-2 text-xs text-gray-500">
                  Tasa anual
                  <input type="number" value={tasas[p.tasaKey]} onChange={(e) => setTasas((t) => ({ ...t, [p.tasaKey]: parseFloat(e.target.value) || 0 }))} className="w-16 border-2 border-[#EDEAFB] rounded-lg px-1.5 py-0.5 text-[#1A1533]" style={{ fontFamily: "'JetBrains Mono', monospace" }} />%
                </label>
              )}
              {p.nuncaPaga ? (
                <div className="text-[#C23E28] text-sm bg-[#FFE8E3] rounded-xl px-3 py-2">Tu pago mensual no cubre ni el interés.</div>
              ) : (
                <>
                  <div><div className="text-[11px] uppercase tracking-wide text-gray-500">{isDeuda ? 'Tiempo para pagarla' : 'Tiempo para lograrlo'}</div><div className="text-lg font-semibold">{monthsToYears(p.meses)}</div></div>
                  <div><div className="text-[11px] uppercase tracking-wide text-gray-500">{isDeuda ? 'Interés total pagado' : 'Interés total ganado'}</div><div className={`text-sm font-semibold ${isDeuda ? 'text-[#C23E28]' : 'text-[#067A48]'}`}>{fmt(p.interes)}</div></div>
                </>
              )}
              <button onClick={() => setDetalle(p)} className="mt-auto py-2 rounded-full text-xs font-semibold text-white" style={{ background: 'linear-gradient(135deg, #5B3DF5, #4530B8)' }}>Analizar destino</button>
            </div>
          );
        })}
      </div>
      {detalle && <DestinoDetalleModal path={detalle} objetivo={objetivo} capacidad={capacidad} tasaAnual={detalle.tasaKey ? tasas[detalle.tasaKey] : 0} onClose={() => setDetalle(null)} />}
    </div>
  );
}

// ---------- App principal ----------
function FinanzasApp() {
  const [tab, setTab] = useState('calculadoras');

  return (
    <div className="min-h-screen w-full" style={{ background: 'radial-gradient(1100px 500px at 85% -10%, rgba(91,61,245,0.10), transparent 60%), radial-gradient(900px 500px at -10% 10%, rgba(18,183,106,0.08), transparent 55%), #FAFAFC' }}>
      <div className="max-w-5xl mx-auto px-4 py-6 sm:py-8" style={{ fontFamily: "'Inter', sans-serif" }}>
        <header className="relative overflow-hidden rounded-3xl mb-5 px-5 py-6 sm:px-8 sm:py-8" style={{ background: 'linear-gradient(135deg, #5B3DF5 0%, #7C5CFF 55%, #4530B8 100%)' }}>
          <svg className="absolute inset-0 w-full h-full opacity-40 pointer-events-none" viewBox="0 0 800 220" preserveAspectRatio="none">
            <path d="M -20 190 C 150 150, 220 230, 380 150 S 620 30, 820 70" fill="none" stroke="#FFC53D" strokeWidth="2.5" className="route-line" strokeLinecap="round" />
            <circle cx="380" cy="150" r="5" fill="#FFC53D" />
            <circle cx="620" cy="60" r="5" fill="#FFC53D" opacity="0.85" />
            <circle cx="150" cy="150" r="4" fill="#FFFFFF" opacity="0.6" />
          </svg>
          <div className="relative">
            <div className="inline-flex items-center gap-2 text-[#FFE9A8] text-xs uppercase tracking-[0.15em] font-semibold mb-3 bg-white/10 rounded-full px-3 py-1">
              <Calculator size={14} /> Matemáticas discretas · finanzas
            </div>
            <h1 className="text-3xl sm:text-4xl text-white" style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700 }}>
              Cuaderno de matemáticas financieras
            </h1>
            <p className="text-white/80 text-sm mt-2 max-w-2xl leading-relaxed">
              Herramientas interactivas para comprender el valor del dinero, equivalencia de tasas y esquemas de amortización.
            </p>
          </div>
        </header>

        <div className="flex gap-2 mb-4 overflow-x-auto pb-2 scrollbar-hide">
          <TabButton active={tab === 'calculadoras'} onClick={() => setTab('calculadoras')} icon={Calculator}>Amortización</TabButton>
          <TabButton active={tab === 'valorTiempo'} onClick={() => setTab('valorTiempo')} icon={ClockIcon}>Valor en el Tiempo</TabButton>
          <TabButton active={tab === 'tasasEquivalentes'} onClick={() => setTab('tasasEquivalentes')} icon={PercentIcon}>Tasas Equivalentes</TabButton>
          <TabButton active={tab === 'simulador'} onClick={() => setTab('simulador')} icon={Target}>Simulador de destinos</TabButton>
        </div>
        
        <div className="bg-white rounded-3xl border border-[#EDEAFB] p-4 sm:p-6 shadow-xl shadow-[#5B3DF5]/[0.06]">
          {tab === 'calculadoras' && <CalculadorasTab />}
          {tab === 'valorTiempo' && <ValorTiempoTab />}
          {tab === 'tasasEquivalentes' && <TasasEquivalentesTab />}
          {tab === 'simulador' && <SimuladorTab />}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<FinanzasApp />);
</script>
</body>
</html>
